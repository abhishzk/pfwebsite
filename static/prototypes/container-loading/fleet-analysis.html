<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Analysis · 83 Export Containers</title>

<style>
:root{
  --ground:#052D41;--panel:#0A3A52;--panel2:#0E4562;--rule:#1A5573;
  --accent:#22A0F3;--accent-dim:rgba(34,160,243,.16);
  --green:#34D399;--green-dim:rgba(52,211,153,.12);
  --amber:#FBBF24;--amber-dim:rgba(251,191,36,.12);
  --red:#F87171;--red-dim:rgba(248,113,113,.12);
  --purple:#A78BFA;--purple-dim:rgba(167,139,250,.14);
  --ink:#fff;--muted:#9BC1D8;--dim:#6A97B3;
  --mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

.topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--panel);flex-wrap:wrap}
.logo{font:600 15px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sep{width:1px;height:18px;background:var(--rule)}
.ctx{color:var(--muted);font-size:15px}
.ctx b{color:var(--ink);font-weight:600}
.badge{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--green-dim);color:var(--green);margin-left:auto}
.nav{display:flex;gap:2px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--rule);overflow-x:auto}
.nl{color:var(--muted);padding:9px 14px;font:15px var(--sans);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.nl:hover{color:var(--ink)}.nl.act{color:var(--ink);border-bottom-color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--rule)}
.kpi{padding:16px 20px;border-right:1px solid var(--rule)}
.kpi:last-child{border-right:none}
.kl{font:500 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kv{font:600 28px/1.2 var(--mono)}
.kn{font:12.5px var(--mono);color:var(--dim);margin-top:2px}

.content{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card{padding:20px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.card:nth-child(2n){border-right:none}
.ch{font:600 16px var(--sans);margin-bottom:4px}
.cs{font:12.5px var(--mono);color:var(--dim);margin-bottom:16px}

.scatter{position:relative;width:100%;aspect-ratio:16/10;background:var(--panel);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.scatter canvas{width:100%;height:100%}
.ax{position:absolute;font:11.5px var(--mono);color:var(--dim)}
.ax-x{bottom:4px;left:50%;transform:translateX(-50%)}
.ax-y{top:50%;left:6px;transform:rotate(-90deg) translateX(-50%);transform-origin:left center}

.bar-chart{display:flex;flex-direction:column;gap:4px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font:12.5px var(--mono);color:var(--muted);min-width:110px;text-align:right;white-space:nowrap}
.bar-track{flex:1;height:18px;background:var(--rule);border-radius:2px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;display:flex;align-items:center;padding-left:6px;font:600 11.5px var(--mono);color:var(--ground);min-width:1px;transition:width .4s}
.bar-val{font:12.5px var(--mono);color:var(--dim);min-width:30px}

.heatmap{display:grid;gap:2px}
.hm-cell{border-radius:2px;display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);min-height:36px}
.hm-label{font:11.5px var(--mono);color:var(--dim);display:flex;align-items:center;justify-content:center}

.dist{display:flex;align-items:flex-end;gap:1px;height:100px;padding:8px 0}
.dist-bar{flex:1;background:var(--accent);border-radius:1px 1px 0 0;min-width:4px;position:relative}
.dist-bar:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--rule);padding:2px 6px;border-radius:3px;font:11.5px var(--mono);color:var(--ink);white-space:nowrap;z-index:2}
.dist-axis{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--dim);padding-top:4px}

.findings{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:14px;margin-top:8px}
.finding{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(26,85,115,.4)}
.finding:last-child{border-bottom:none}
.f-num{font:600 22px var(--mono);min-width:60px;color:var(--accent)}
.f-txt{font-size:14px;color:var(--muted);line-height:1.5}
.f-txt b{color:var(--ink)}

.note{grid-column:1/-1;padding:16px 20px;font-size:13px;color:var(--dim);line-height:1.6;border-top:1px solid var(--rule);background:var(--panel)}
.note b{color:var(--muted)}

@media(max-width:900px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi:nth-child(3){border-right:none}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .content{grid-template-columns:1fr}
  .card{border-right:none}
}
*{scrollbar-width:thin;scrollbar-color:#1A5573 transparent}
</style>
</head>

    ${doors.map(door=>`<div class="hm-label">${door}</div>${dests.map(dest=>{
      const n=doorDest[door+'/'+dest];
      const alpha=n?0.2+0.8*(n/maxDD):0;
      return `<div class="hm-cell" style="background:rgba(34,160,243,${alpha})">${n||''}</div>`;
    }).join('')}`).join('')}
  </div>`;
content.appendChild(c6);

// 7. Keyed fill vs declared vol
const c7=document.createElement('div');c7.className='card';
const filled=data.filter(d=>d.fill>0);
const noFill=data.filter(d=>d.fill===0);
c7.innerHTML=`<div class="ch">Operator-keyed fill vs declared volume</div><div class="cs">${filled.length} of 83 have a fill entry; ${noFill.length} are blank</div>
  <div class="findings">
    <div class="finding"><div class="f-num">${filled.filter(d=>d.fill===100).length}</div><div class="f-txt"><b>Keyed 100%</b> — operator says full. Average declared volume: ${Math.round(filled.filter(d=>d.fill===100).reduce((a,d)=>a+d.volPct,0)/filled.filter(d=>d.fill===100).length)}%. The gap between 100% keyed and actual cube is what a camera could close.</div></div>
    <div class="finding"><div class="f-num">${noFill.length}</div><div class="f-txt"><b>No fill recorded</b> — 29% of exports have no operator entry at all. The field is advisory and often skipped.</div></div>
  </div>`;
content.appendChild(c7);

// 8. Notes / anomalies
const c8=document.createElement('div');c8.className='card';
const noteTypes={};
data.forEach(d=>{if(d.notes){const k=d.notes.split(' - ')[0].split(',')[0].trim();if(k)noteTypes[k]=(noteTypes[k]||0)+1}});
const noteEntries=Object.entries(noteTypes).sort((a,b)=>b[1]-a[1]);
const maxNote=Math.max(...noteEntries.map(e=>e[1]));
c8.innerHTML=`<div class="ch">Shipping notes</div><div class="cs">Operator notes from the export log</div>
  <div class="bar-chart">${noteEntries.map(([note,n])=>`<div class="bar-row"><div class="bar-label" style="min-width:200px">${note}</div><div class="bar-track"><div class="bar-fill" style="width:${n/maxNote*100}%;background:var(--amber)">${n}</div></div><div class="bar-val"></div></div>`).join('')}</div>`;
content.appendChild(c8);

// Note
content.innerHTML+=`<div class="note"><b>Data source:</b> Exporter shipping export, August 2026 (3 weeks). 184 total shipments, 83 export containers (SEA), 101 domestic trailers (ROAD). All figures in this dashboard are from the real shipping log. Declared volume uses the pallet-master figure (one standing number per SKU family), not measured cube. The 36.6% gap is nominal, not measured empty space. Only measurement can establish how much space is physically empty and whether any of it is avoidable.</div>`;

// ── Scatter plot ──
setTimeout(()=>{
  const cv=document.getElementById('scatter');
  if(!cv)return;
  const rect=cv.parentElement.getBoundingClientRect();
  const dpr=devicePixelRatio||1;
  cv.width=rect.width*dpr;cv.height=rect.height*dpr;
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=rect.width,H=rect.height;
  const pad={l:52,r:24,t:24,b:40};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;

  // Grid
  ctx.strokeStyle='rgba(26,85,115,.5)';ctx.lineWidth=1;
  for(let v=0;v<=100;v+=20){
    const x=pad.l+v/100*pw;
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,H-pad.b);ctx.stroke();
    ctx.fillStyle='#6A97B3';ctx.font='11.5px "JetBrains Mono"';ctx.textAlign='center';
    ctx.fillText(v+'%',x,H-pad.b+18);
  }
  for(let v=0;v<=100;v+=20){
    const y=H-pad.b-v/100*ph;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#6A97B3';ctx.font='11.5px "JetBrains Mono"';ctx.textAlign='right';
    ctx.fillText(v+'%',pad.l-8,y+4);
  }

  // 90% payload line
  const y90=H-pad.b-90/100*ph;
  ctx.strokeStyle='rgba(251,191,36,.5)';ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(pad.l,y90);ctx.lineTo(W-pad.r,y90);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#FBBF24';ctx.font='600 11.5px "JetBrains Mono"';ctx.textAlign='left';
  ctx.textAlign='right';ctx.fillText('90% payload',W-pad.r-6,y90-6);

  // Points
  const skuColors={'ALT-STATOR':'#22A0F3','BRAKE-ROTOR':'#F87171','CAST-HOUSING':'#FBBF24',
    'HARNESS-ASSY':'#34D399','PLASTIC-CLIP':'#A78BFA','SENSOR-MOD':'#FB923C','TRIM-PANEL':'#38BDF8'};
  data.forEach(d=>{
    const x=pad.l+d.volPct/100*pw;
    const y=H-pad.b-d.payPct/100*ph;
    ctx.beginPath();ctx.arc(x,y,5.5,0,Math.PI*2);
    ctx.fillStyle=skuColors[d.sku]||'#22A0F3';ctx.globalAlpha=0.8;ctx.fill();ctx.globalAlpha=1;
    if(d.notes.includes('partial')){
      ctx.strokeStyle='#F87171';ctx.lineWidth=2;ctx.stroke();
    }
  });

  // Legend
  const lx=pad.l+16,ly=H-pad.b-7*20-6;
  let li=0;
  Object.entries(skuColors).forEach(([sku,col])=>{
    const y=ly+li*20;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(lx,y,4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#9BC1D8';ctx.font='11.5px "JetBrains Mono"';ctx.textAlign='left';
    ctx.fillText(sku,lx+12,y+4);
    li++;
  });
},100);
</script>
</body></html>
