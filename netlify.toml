[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/images/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/abhishek-kumar-resume.pdf"
  [headers.values]
    cache-control = "public, max-age=3600, must-revalidate"
