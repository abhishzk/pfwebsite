[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22.12.0"

[[headers]]
  for = "/images/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Abhishek_Kumar_Resume.pdf"
  [headers.values]
    cache-control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/prototypes/*"
  [headers.values]
    X-Robots-Tag = "noindex"
