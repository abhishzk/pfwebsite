<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/images/ak-mark.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="author" content="Abhishek Kumar" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111419" media="(prefers-color-scheme: dark)" />
		<script>
			(function () {
				const stored = localStorage.getItem('theme');
				const dark = stored === 'dark';
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
